[project]
name = "audit-hq-mvp"
version = "0.1.0"
description = "Audit-HQ demo — risk management for customs (BCQT analytics)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "xlsxwriter>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends/Query/Form/File are intentional sentinels in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.Header", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# System prompt cho LLM — text Vietnamese tự nhiên, không wrap ở word boundary hợp lý.
"app/ai/system_prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
