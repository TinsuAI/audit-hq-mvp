[project]
name = "audit-hq-mvp"
version = "0.1.0"
description = "Audit-HQ demo — risk management for customs (BCQT analytics)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "xlsxwriter>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "markdown>=3.6",
    # `app/ai/config.py` gọi `httpx` TRỰC TIẾP (kiểm tra khoá API, liệt kê model). Trước
    # 2026-08-17 nó vào ảnh nhờ `openai` kéo theo; `openai` 3.1.0 chuyển sang `httpx2`
    # nên `import httpx` gãy và container prod không khởi động được. Thư viện nào mã
    # nguồn import thẳng thì phải khai thẳng, không dựa vào phụ thuộc bắc cầu.
    "httpx>=0.28",
    # `app/errors.py` import thẳng `starlette` (3 chỗ). Cùng lý do như `httpx`: nay nó
    # vào ảnh nhờ `fastapi`, và ràng buộc đó không phải của mình.
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends/Query/Form/File are intentional sentinels in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.Header", "fastapi.File", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# System prompt cho LLM — text Vietnamese tự nhiên, không wrap ở word boundary hợp lý.
"app/ai/system_prompt.py" = ["E501"]
# Catalog 49 kiểm tra — mô tả nghiệp vụ tiếng Việt dài, wrap làm khó đọc.
"app/catalog_full.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
