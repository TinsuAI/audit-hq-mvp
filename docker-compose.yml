services:
  app:
    build: .
    container_name: audit-hq-mvp
    ports:
      - "8000:8000"
    volumes:
      - ./db-data:/data
      - ./data:/raw-data:ro
    environment:
      - DATABASE_URL=sqlite:////data/audit_hq.sqlite
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - RAW_DATA_PATH=/raw-data
    restart: unless-stopped
