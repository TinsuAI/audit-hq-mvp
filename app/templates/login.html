{% extends "base.html" %}
{% block title %}Đăng nhập — Audit-HQ{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card">
    <h1>Đăng nhập</h1>
    <p class="login-sub">Hệ thống Audit-HQ — Quản lý rủi ro Hải quan</p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="form-stack">
      <div class="form-field">
        <label class="form-label" for="user">Tài khoản</label>
        <input class="form-input" id="user" type="text" name="user" autocomplete="username" required autofocus>
      </div>
      <div class="form-field">
        <label class="form-label" for="password">Mật khẩu</label>
        <input class="form-input" id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Đăng nhập</button>
    </form>
  </div>
</div>
{% endblock %}
