{% extends "base.html" %}
{% block title %}Đăng nhập — Audit-HQ{% endblock %}
{% block content %}
<section class="login">
  <h2>Đăng nhập</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Tài khoản<input type="text" name="user" autocomplete="username" required></label>
    <label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Đăng nhập</button>
  </form>
</section>
{% endblock %}
