name: Test & Deploy to Tinsu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, tinsu-prod]
    # 5 phút không đủ từ khi suite qua ~1.000 test: ba lượt merge d528b2f (#55),
    # 808d9dc (#64), 78c444d (#67) đều bị huỷ đúng mốc 5 phút, nên `deploy` skip và
    # prod đứng ở 0b9e3b2 ngày 01/08. Nới lên 20 để có biên cho cả bước dựng venv.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup venv (uv)
        run: |
          export PATH="$HOME/.local/bin:/snap/bin:$PATH"
          uv venv --python python3.13 .venv
          uv pip install -e ".[dev]" --python .venv/bin/python --quiet

      - name: Run tests
        run: .venv/bin/pytest -q

      - name: Lint
        run: .venv/bin/ruff check app tests scripts

  deploy:
    needs: test
    runs-on: [self-hosted, tinsu-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Compute build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        env:
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
          BUILD_TIME: ${{ steps.meta.outputs.time }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: docker compose build

      - name: Backup prod DB before migrating
        env:
          DB_DATA_PATH: ${{ vars.DB_DATA_PATH }}
        run: |
          : "${DB_DATA_PATH:?repo variable DB_DATA_PATH not set — refusing deploy}"
          DB="$DB_DATA_PATH/audit_hq.sqlite"
          if [ ! -f "$DB" ]; then
            echo "Chưa có $DB — bỏ qua backup (lần deploy đầu)."
            exit 0
          fi
          # `entrypoint.sh` chạy `alembic upgrade head` lúc container khởi động, nên
          # bước kế tiếp SỬA schema prod. Backup qua sqlite3 backup API: an toàn với
          # WAL và với DB đang có người ghi — `cp` file .sqlite đơn lẻ mất nội dung WAL.
          python3 - "$DB" <<'PY'
          import sqlite3, sys, time
          src = sys.argv[1]
          dst = f"{src}.bak-predeploy-{time.strftime('%Y%m%d-%H%M%S')}"
          s = sqlite3.connect(f"file:{src}?mode=ro", uri=True)
          d = sqlite3.connect(dst)
          with d:
              s.backup(d)
          print("integrity:", d.execute("pragma integrity_check").fetchone()[0])
          d.close(); s.close()
          print("backup ->", dst)
          PY
          # Giữ 5 bản gần nhất, xoá phần còn lại để không đầy đĩa runner.
          ls -1t "$DB".bak-predeploy-* 2>/dev/null | tail -n +6 | xargs -r rm -f

      - name: Restart container
        env:
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
          BUILD_TIME: ${{ steps.meta.outputs.time }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          AUTH_USER: ${{ secrets.AUTH_USER || 'admin' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'admin' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'change-me-in-prod' }}
          # Persistent paths ngoài workdir runner (bị wipe khi checkout). Đặt qua
          # GitHub repo Variables — KHÔNG hardcode deploy target trong file commit.
          DB_DATA_PATH: ${{ vars.DB_DATA_PATH }}
          RAW_DATA_PATH: ${{ vars.RAW_DATA_PATH }}
        run: |
          # Refuse to deploy if a path var is unset — avoids compose fallback to
          # ./db-data inside the wiped workdir, which would lose the prod DB.
          : "${DB_DATA_PATH:?repo variable DB_DATA_PATH not set — refusing deploy (would lose prod DB)}"
          : "${RAW_DATA_PATH:?repo variable RAW_DATA_PATH not set — refusing deploy}"
          docker compose up -d --no-deps app

      - name: Wait for healthcheck
        env:
          HOST_PORT: 8200
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:$HOST_PORT/healthz >/dev/null 2>&1; then
              echo "✓ Service ready on port $HOST_PORT"
              curl -s http://127.0.0.1:$HOST_PORT/healthz | head -1
              exit 0
            fi
            sleep 2
          done
          echo "✗ Service did not become ready in 60s"
          docker compose logs --tail 50
          exit 1

      - name: Show deployed version
        run: |
          echo "Deployed: v${{ steps.meta.outputs.version }} · build ${{ steps.meta.outputs.sha }} · ${{ steps.meta.outputs.time }}"
          docker compose ps
